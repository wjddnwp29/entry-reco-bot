<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>회원가입 | 엔트리 추천 챗봇</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50">
  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold">🎯 엔트리 추천 챗봇</a>
      <nav class="text-sm">
        <a href="/login" class="text-slate-600 hover:text-slate-900">로그인</a>
      </nav>
    </div>
  </header>

  <!-- Flash / msg -->
  <div class="max-w-lg mx-auto px-6 mt-6">
    {% set flashes = get_flashed_messages(with_categories=true) %}
    {% if flashes %}
      {% for cat, m in flashes %}
        <div class="mb-3 px-4 py-3 rounded-xl border
            {% if cat=='success' %} bg-green-50 border-green-200 text-green-700
            {% elif cat=='error' %} bg-rose-50 border-rose-200 text-rose-700
            {% else %} bg-slate-100 border-slate-200 text-slate-700 {% endif %}">
          {{ m }}
        </div>
      {% endfor %}
    {% endif %}
    {% if msg %}
      <div class="mb-3 px-4 py-3 rounded-xl border bg-rose-50 border-rose-200 text-rose-700">
        {{ msg }}
      </div>
    {% endif %}
  </div>

  <!-- 가입 카드 -->
  <main class="max-w-lg mx-auto px-6 py-10">
    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
      <h1 class="text-2xl font-bold">📝 회원가입</h1>
      <p class="text-slate-600 mt-1 mb-6 text-sm">필수 정보를 입력해 주세요.</p>

      <form method="post" action="/signup" class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-sm mb-1">아이디 (4~20자)</label>
          <input name="id" minlength="4" maxlength="20" required
                 class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">비밀번호 (5자 이상)</label>
            <input name="pw" type="password" minlength="5" required
                   class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
          <div>
            <label class="block text-sm mb-1">비밀번호 확인</label>
            <input name="pw2" type="password" minlength="5" required
                   class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
        </div>

        <div>
          <label class="block text-sm mb-1">이름</label>
          <input name="name" required
                 class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-sm mb-1">생년월일</label>
          <input name="birthdate" type="date" required
                 class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">성별</label>
            <select name="gender"
                    class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
              <option value="">선택</option>
              <option value="여">여</option>
              <option value="남">남</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1">학년</label>
            <select name="grade"
                    class="w-full rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
              <option value="">선택</option>
              <option>초1</option>
              <option>초2</option>
              <option>초3</option>
              <option>초4</option>
              <option>초5</option>
              <option>초6</option>
            </select>
          </div>
        </div>

        <button class="w-full py-3 mt-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold">
          가입하기
        </button>
      </form>

      <p class="mt-5 text-sm text-slate-600">
        이미 계정이 있으신가요?
        <a href="/login" class="text-indigo-600 font-medium hover:underline">로그인</a>
      </p>
    </div>
  </main>

  <!-- 비밀번호 확인 체크 -->
  <script>
    const form = document.querySelector('form[action="/signup"]');
    form.addEventListener('submit', (e) => {
      const pw1 = form.querySelector('input[name="pw"]').value.trim();
      const pw2 = form.querySelector('input[name="pw2"]').value.trim();
      if (pw1 !== pw2) {
        e.preventDefault();
        alert("비밀번호가 일치하지 않습니다.");
      }
    });
  </script>
</body>
</html>
